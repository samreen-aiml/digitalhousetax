<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital House Tax System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Digital House Tax Management System</h1>
        <p>Property Tax Collection Portal</p>
    </header>

    <div class="container">

        <h2>Property Details</h2>

        <form id="taxForm">
            <label>Owner Name</label>
            <input type="text" id="owner" required>

            <label>House Number</label>
            <input type="text" id="house" required>

            <label>Address</label>
            <input type="text" id="address" required>

            <label>Property Type</label>
            <select id="type">
                <option value="Residential">Residential</option>
                <option value="Commercial">Commercial</option>
            </select>

            <label>House Area (sq. ft.)</label>
            <input type="number" id="area" min="1" required>

            <button type="button" onclick="calculateTax()">
                Calculate Tax
            </button>

            <h3 id="taxResult">Estimated Tax: ₹0</h3>

            <button type="submit">Save Property</button>
        </form>

        <hr>

        <h2>Registered Properties</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by owner or house number"
            oninput="displayProperties()"
        >

        <div id="propertyList"></div>

        <button onclick="loadSamples()">Load Sample Data</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
